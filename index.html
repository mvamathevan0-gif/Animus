<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PROJECT ANIMUS — Cybernetic Vision & Voice HUD</title>

  <!-- MediaPipe CDN Libraries -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>

  <style>
    :root {
      --cyan: #00f0ff;
      --magenta: #ff0055;
      --dark-bg: #06090e;
      --card-bg: rgba(13, 17, 23, 0.9);
      --font-mono: 'Courier New', Courier, monospace;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--dark-bg);
      background-image: radial-gradient(circle at 50% 50%, rgba(0, 240, 255, 0.05) 0%, transparent 80%);
      color: #ffffff;
      font-family: 'Segoe UI', system-ui, sans-serif;
      height: 100vh;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* Landing Screen */
    #home-screen {
      text-align: center;
      max-width: 700px;
      padding: 40px;
      background: var(--card-bg);
      border: 1px solid rgba(0, 240, 255, 0.4);
      border-radius: 16px;
      box-shadow: 0 0 30px rgba(0, 240, 255, 0.2);
    }

    h1 {
      font-size: 36px;
      margin-bottom: 15px;
      color: #fff;
    }

    p.subtitle {
      color: #8b949e;
      font-size: 15px;
      margin-bottom: 30px;
    }

    .launch-btn {
      background: rgba(0, 240, 255, 0.1);
      color: var(--cyan);
      border: 2px solid var(--cyan);
      padding: 16px 32px;
      font-size: 16px;
      font-weight: bold;
      font-family: var(--font-mono);
      letter-spacing: 2px;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .launch-btn:hover {
      background: var(--cyan);
      color: #000;
      box-shadow: 0 0 25px rgba(0, 240, 255, 0.8);
    }

    /* HUD Screen */
    #hud-screen {
      display: none;
      width: 100vw;
      height: 100vh;
      padding: 20px;
      grid-template-columns: 1fr 300px;
      gap: 20px;
    }

    .viewport-container {
      position: relative;
      width: 100%;
      height: 100%;
      background: #000;
      border-radius: 12px;
      border: 1px solid var(--cyan);
      overflow: hidden;
    }

    video { display: none; }
    canvas { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }

    .telemetry-sidebar {
      background: var(--card-bg);
      border: 1px solid rgba(0, 240, 255, 0.3);
      border-radius: 12px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      font-family: var(--font-mono);
    }

    .joint-metric { margin-bottom: 15px; }
    .joint-label { display: flex; justify-content: space-between; font-size: 12px; color: #8b949e; margin-bottom: 4px; }
    .joint-label span { color: var(--cyan); font-weight: bold; }
    .bar-bg { width: 100%; height: 8px; background: rgba(255, 255, 255, 0.1); border-radius: 4px; overflow: hidden; }
    .bar-fill { height: 100%; width: 100%; background: var(--cyan); transition: width 0.1s; }
  </style>
</head>
<body>

  <!-- LANDING PAGE -->
  <div id="home-screen">
    <div style="font-family: var(--font-mono); color: var(--cyan); font-size: 12px; letter-spacing: 3px; margin-bottom: 10px;">PROJECT ANIMUS v2</div>
    <h1>Multimodal HUD Interface</h1>
    <p class="subtitle">Real-time hand tracking, servo kinematic telemetry, and voice assistant bridge.</p>
    <button class="launch-btn" id="start-btn">CONNECT ROBOTIC HAND & LAUNCH HUD</button>
  </div>

  <!-- HUD DASHBOARD -->
  <div id="hud-screen">
    <div class="viewport-container">
      <video id="webcam" playsinline></video>
      <canvas id="output_canvas" width="1280" height="720"></canvas>
    </div>

    <div class="telemetry-sidebar">
      <div>
        <div style="color: var(--cyan); border-bottom: 1px solid rgba(0,240,255,0.2); padding-bottom: 8px; margin-bottom: 20px; font-size: 14px;">SERVO TELEMETRY</div>
        
        <div class="joint-metric">
          <div class="joint-label">THUMB <span id="val-thumb">180°</span></div>
          <div class="bar-bg"><div class="bar-fill" id="bar-thumb"></div></div>
        </div>
        <div class="joint-metric">
          <div class="joint-label">INDEX <span id="val-index">180°</span></div>
          <div class="bar-bg"><div class="bar-fill" id="bar-index"></div></div>
        </div>
        <div class="joint-metric">
          <div class="joint-label">MIDDLE <span id="val-middle">180°</span></div>
          <div class="bar-bg"><div class="bar-fill" id="bar-middle"></div></div>
        </div>
        <div class="joint-metric">
          <div class="joint-label">RING <span id="val-ring">180°</span></div>
          <div class="bar-bg"><div class="bar-fill" id="bar-ring"></div></div>
        </div>
        <div class="joint-metric">
          <div class="joint-label">PINKY <span id="val-pinky">180°</span></div>
          <div class="bar-bg"><div class="bar-fill" id="bar-pinky"></div></div>
        </div>
      </div>

      <div style="background: rgba(0,0,0,0.4); padding: 10px; border-radius: 6px; font-size: 11px;">
        <div style="color: var(--magenta);">VOICE ENGINE</div>
        <div id="transcript" style="color: #c9d1d9; margin-top: 4px;">Say "Jarvis"...</div>
      </div>
    </div>
  </div>

  <script>
    document.getElementById('start-btn').addEventListener('click', async () => {
      console.log('Launch button clicked!');
      
      // 1. Hide Landing Page & Show HUD
      document.getElementById('home-screen').style.display = 'none';
      document.getElementById('hud-screen').style.display = 'grid';

      // 2. Request Camera Permissions
      const videoElement = document.getElementById('webcam');
      const canvasElement = document.getElementById('output_canvas');
      const canvasCtx = canvasElement.getContext('2d');

      try {
        const stream = await navigator.mediaDevices.getUserMedia({ video: { width: 1280, height: 720 } });
        videoElement.srcObject = stream;
        await videoElement.play();
        console.log('Webcam feed started successfully!');
      } catch (err) {
        alert('Camera access denied or unavailable: ' + err.message);
        return;
      }

      // 3. Initialize MediaPipe Hands
      const hands = new Hands({
        locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
      });

      hands.setOptions({
        maxNumHands: 1,
        modelComplexity: 0,
        minDetectionConfidence: 0.5,
        minTrackingConfidence: 0.5
      });

      hands.onResults((results) => {
        canvasCtx.save();
        canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);
        canvasCtx.drawImage(results.image, 0, 0, canvasElement.width, canvasElement.height);

        if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
          const landmarks = results.multiHandLandmarks[0];
          drawConnectors(canvasCtx, landmarks, HAND_CONNECTIONS, { color: '#00f0ff', lineWidth: 3 });
          drawLandmarks(canvasCtx, landmarks, { color: '#ff0055', fillColor: '#ffffff', radius: 4 });

          // Simple Finger Extension Calculation
          const wrist = landmarks[0];
          const tips = [4, 8, 12, 16, 20];
          const names = ['thumb', 'index', 'middle', 'ring', 'pinky'];

          tips.forEach((tipIdx, i) => {
            const tip = landmarks[tipIdx];
            const dist = Math.hypot(tip.x - wrist.x, tip.y - wrist.y);
            let angle = Math.round(Math.min(180, Math.max(0, (dist / 0.5) * 180)));
            document.getElementById(`val-${names[i]}`).innerText = `${angle}°`;
            document.getElementById(`bar-${names[i]}`).style.width = `${(angle / 180) * 100}%`;
          });
        }
        canvasCtx.restore();
      });

      // 4. Send Frames to MediaPipe
      async function processFrame() {
        if (!videoElement.paused && !videoElement.ended) {
          await hands.send({ image: videoElement });
        }
        requestAnimationFrame(processFrame);
      }
      processFrame();

      // 5. Speech Recognition
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (SpeechRecognition) {
        const recognition = new SpeechRecognition();
        recognition.continuous = true;
        recognition.interimResults = true;
        recognition.onresult = (event) => {
          let text = event.results[event.results.length - 1][0].transcript;
          document.getElementById('transcript').innerText = `"${text}"`;
        };
        recognition.start();
      }
    });
  </script>
</body>
</html>
