<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PROJECT ANIMUS — Cybernetic Vision & Voice HUD</title>
  <link rel="icon" href="data:,">

  <!-- MediaPipe Libraries -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>

  <style>
    :root {
      --bg-black: #050505;
      --primary-blue: #4285F4;
      --accent-red: #FF3344;
      --card-base: #121214;
      --card-border: rgba(66, 133, 244, 0.25);
      --text-white: #F3F4F6;
      --text-dim: #9CA3AF;
      --font-mono: 'Courier New', Courier, monospace;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg-black);
      background-image: 
        radial-gradient(circle at 50% 50%, rgba(66, 133, 244, 0.04) 0%, transparent 80%),
        linear-gradient(rgba(255, 255, 255, 0.015) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.015) 1px, transparent 1px);
      background-size: 100% 100%, 30px 30px, 30px 30px;
      color: var(--text-white);
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      height: 100vh;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* Landing Screen */
    #home-screen {
      text-align: center;
      max-width: 720px;
      padding: 45px;
      background: var(--card-base);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      box-shadow: 0 0 40px rgba(0, 0, 0, 0.9), 0 0 20px rgba(66, 133, 244, 0.15);
      z-index: 10;
    }

    .title-tag {
      font-family: var(--font-mono);
      color: var(--accent-red);
      font-size: 12px;
      letter-spacing: 4px;
      margin-bottom: 12px;
      text-transform: uppercase;
    }

    h1 {
      font-size: 36px;
      font-weight: 800;
      letter-spacing: 1px;
      color: var(--text-white);
      margin-bottom: 16px;
    }

    p.subtitle {
      color: var(--text-dim);
      font-size: 14px;
      line-height: 1.6;
      margin-bottom: 35px;
    }

    .launch-btn {
      background: rgba(66, 133, 244, 0.1);
      color: var(--primary-blue);
      border: 1px solid var(--primary-blue);
      padding: 14px 32px;
      font-size: 14px;
      font-weight: bold;
      font-family: var(--font-mono);
      letter-spacing: 2px;
      border-radius: 6px;
      cursor: pointer;
      box-shadow: 0 0 15px rgba(66, 133, 244, 0.2);
      transition: all 0.3s ease;
    }

    .launch-btn:hover {
      background: var(--primary-blue);
      color: #ffffff;
      box-shadow: 0 0 25px rgba(66, 133, 244, 0.5);
    }

    /* HUD Dashboard Layout */
    #hud-screen {
      display: none;
      width: 100vw;
      height: 100vh;
      flex-direction: column;
      position: absolute;
      top: 0;
      left: 0;
    }

    .top-navbar {
      height: 60px;
      padding: 0 25px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(18, 18, 20, 0.95);
      border-bottom: 1px solid var(--card-border);
      backdrop-filter: blur(10px);
      z-index: 25;
    }

    .brand-title {
      font-family: var(--font-mono);
      font-size: 14px;
      font-weight: bold;
      letter-spacing: 2px;
      color: var(--text-white);
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .status-badge {
      display: flex;
      align-items: center;
      gap: 8px;
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--primary-blue);
      background: rgba(5, 5, 5, 0.6);
      padding: 4px 12px;
      border-radius: 4px;
      border: 1px solid rgba(66, 133, 244, 0.3);
    }

    .pulse-dot {
      width: 7px;
      height: 7px;
      background-color: var(--accent-red);
      border-radius: 50%;
      box-shadow: 0 0 8px var(--accent-red);
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0% { opacity: 0.3; }
      50% { opacity: 1.0; }
      100% { opacity: 0.3; }
    }

    /* =========================================================================
       COLLAPSIBLE BLUETOOTH HARDWARE SHELF
       ========================================================================= */
    .hardware-shelf {
      position: absolute;
      top: 60px;
      left: 50%;
      transform: translateX(-50%);
      width: 600px;
      background: rgba(18, 18, 20, 0.98);
      border: 1px solid var(--card-border);
      border-top: none;
      border-bottom-left-radius: 10px;
      border-bottom-right-radius: 10px;
      box-shadow: 0 15px 30px rgba(0,0,0,0.8);
      z-index: 30;
      max-height: 0;
      overflow: hidden;
      transition: max-height 0.4s cubic-bezier(0.16, 1, 0.3, 1), padding 0.4s ease;
      padding: 0 25px;
    }

    .hardware-shelf.open {
      max-height: 220px;
      padding: 20px 25px;
      border-color: var(--primary-blue);
    }

    .shelf-toggle-tab {
      position: absolute;
      top: 60px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(18, 18, 20, 0.95);
      border: 1px solid var(--card-border);
      border-top: none;
      padding: 4px 18px;
      border-bottom-left-radius: 8px;
      border-bottom-right-radius: 8px;
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--primary-blue);
      cursor: pointer;
      z-index: 35;
      transition: all 0.2s ease;
    }

    .shelf-toggle-tab:hover {
      background: var(--primary-blue);
      color: #fff;
    }

    .shelf-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
      align-items: center;
    }

    .shelf-section-title {
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--accent-red);
      letter-spacing: 2px;
      margin-bottom: 8px;
      border-bottom: 1px solid rgba(255,255,255,0.08);
      padding-bottom: 4px;
    }

    .motor-stat {
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--text-dim);
      display: flex;
      justify-content: space-between;
      margin-bottom: 4px;
    }
    .motor-stat span { color: var(--text-white); }

    .bt-connect-btn {
      background: rgba(66, 133, 244, 0.15);
      color: var(--primary-blue);
      border: 1px solid var(--primary-blue);
      padding: 10px;
      font-family: var(--font-mono);
      font-size: 11px;
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;
      width: 100%;
      margin-top: 10px;
      transition: all 0.2s;
    }

    .bt-connect-btn:hover {
      background: var(--primary-blue);
      color: #fff;
      box-shadow: 0 0 15px rgba(66, 133, 244, 0.4);
    }

    /* =========================================================================
       CINEMATIC HUD LAYOUT
       ========================================================================= */
    .mockup-grid {
      flex: 1;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      padding: 20px;
      height: calc(100vh - 60px);
      overflow: hidden;
    }

    .video-frame, .angles-card, .voice-card {
      position: relative;
    }

    .video-frame::before, .angles-card::before, .voice-card::before,
    .video-frame::after, .angles-card::after, .voice-card::after {
      content: '';
      position: absolute;
      width: 12px;
      height: 12px;
      border-color: var(--primary-blue);
      border-style: solid;
      pointer-events: none;
      z-index: 5;
    }
    .video-frame::before, .angles-card::before, .voice-card::before {
      top: 6px; left: 6px;
      border-width: 2px 0 0 2px;
    }
    .video-frame::after, .angles-card::after, .voice-card::after {
      bottom: 6px; right: 6px;
      border-width: 0 2px 2px 0;
    }

    .video-frame {
      background: var(--card-base);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    }

    video { display: none; }
    canvas {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scaleX(-1);
    }

    .right-stack {
      display: flex;
      flex-direction: column;
      gap: 20px;
      height: 100%;
      position: relative;
    }

    .angles-card {
      background: var(--card-base);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 20px;
      transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
      overflow: hidden;
    }

    .angles-card.collapsed { display: none; }

    .card-title {
      font-family: var(--font-mono);
      font-size: 13px;
      color: var(--primary-blue);
      letter-spacing: 2px;
      border-bottom: 1px solid var(--card-border);
      padding-bottom: 8px;
      margin-bottom: 15px;
    }

    .joint-metric { margin-bottom: 12px; }
    .joint-label {
      display: flex;
      justify-content: space-between;
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--text-dim);
      margin-bottom: 4px;
    }
    .joint-label span.val { color: var(--primary-blue); font-weight: bold; }

    .bar-bg {
      width: 100%;
      height: 6px;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 3px;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
    .bar-fill {
      height: 100%;
      width: 100%;
      background: linear-gradient(90deg, var(--primary-blue), var(--accent-red));
      transition: width 0.1s linear;
    }

    .voice-card {
      flex: 1;
      background: var(--card-base);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
    }

    .voice-card.active-listen {
      border-color: var(--accent-red);
      box-shadow: 0 0 30px rgba(255, 51, 68, 0.25);
    }

    .voice-header {
      display: flex;
      align-items: center;
      gap: 10px;
      font-family: var(--font-mono);
      font-size: 13px;
      color: var(--accent-red);
      margin-bottom: 12px;
    }

    .voice-wave {
      display: flex;
      align-items: center;
      gap: 3px;
      height: 14px;
    }

    .wave-bar {
      width: 3px;
      height: 100%;
      background: var(--accent-red);
      animation: wave 1s infinite ease-in-out;
    }

    .wave-bar:nth-child(2) { animation-delay: 0.2s; }
    .wave-bar:nth-child(3) { animation-delay: 0.4s; }

    @keyframes wave {
      0%, 100% { height: 4px; }
      50% { height: 14px; }
    }

    .transcript-box {
      font-family: var(--font-mono);
      font-size: 13px;
      color: var(--text-white);
      line-height: 1.5;
      min-height: 60px;
      word-break: break-word;
    }

    .reply-box {
      margin-top: 10px;
      font-family: var(--font-mono);
      font-size: 12px;
      color: var(--primary-blue);
      border-top: 1px solid var(--card-border);
      padding-top: 10px;
    }

    .input-row {
      display: flex;
      gap: 8px;
      margin-top: 15px;
      border-top: 1px solid var(--card-border);
      padding-top: 12px;
    }

    .input-row input {
      flex: 1;
      background: rgba(5, 5, 5, 0.8);
      border: 1px solid var(--card-border);
      border-radius: 6px;
      padding: 8px 12px;
      color: var(--text-white);
      font-family: var(--font-mono);
      font-size: 12px;
      outline: none;
    }

    .input-row input:focus { border-color: var(--primary-blue); }

    .input-row button {
      background: rgba(66, 133, 244, 0.15);
      color: var(--primary-blue);
      border: 1px solid var(--primary-blue);
      padding: 8px 16px;
      font-family: var(--font-mono);
      font-size: 12px;
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;
    }

    /* Responsive Mobile Layout */
    @media (max-width: 768px) {
      .mockup-grid {
        grid-template-columns: 1fr;
        overflow-y: auto;
        height: calc(100vh - 60px);
      }
